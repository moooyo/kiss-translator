name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v2.0.28)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "24"
  PNPM_VERSION: "9.14.4"
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Test and build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate release metadata
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          CHANGELOG_TAG="$(awk '/^## / { print $2; exit }' CHANGELOG.md)"
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${EXPECTED_TAG}." >&2
            exit 1
          fi
          if [[ "${CHANGELOG_TAG}" != "${RELEASE_TAG}" ]]; then
            echo "CHANGELOG.md starts with ${CHANGELOG_TAG}, expected ${RELEASE_TAG}." >&2
            exit 1
          fi
      - name: Run the complete release pipeline
        run: pnpm build+zip
      - name: Upload release bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundles-${{ env.RELEASE_TAG }}
          path: build/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload website artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-website-${{ env.RELEASE_TAG }}
          path: build/web
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles-${{ env.RELEASE_TAG }}
          path: release-bundles
      - name: Extract release notes
        shell: bash
        run: |
          awk '/^## / { if (found) exit; found=1; next } found' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "Release ${RELEASE_TAG}" > release-notes.md
          fi
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-bundles/*.zip --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "Release ${RELEASE_TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" release-bundles/*.zip \
              --verify-tag \
              --title "Release ${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi

  deploy-pages:
    name: Deploy website to GitHub Pages
    needs:
      - build
      - release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out GitHub Pages branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Download website artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-website-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/release-website
      - name: Publish website to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "${RUNNER_TEMP}/release-website/." .
          git add --all
          if git diff --cached --quiet; then
            echo "The gh-pages branch already contains the website for ${RELEASE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy ${RELEASE_TAG}"
          git push origin HEAD:gh-pages
