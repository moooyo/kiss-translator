name: publish release version

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base 需要完整历史，默认的浅克隆拿不到。
          fetch-depth: 0

      # dev-newui 是这个 fork 的发布分支。工作流由 tag 触发，从任何分支打 tag
      # 都会跑到这里，所以在花掉一整轮构建之前先把「tag 不在发布分支上」挡掉。
      - name: Tag must be on dev-newui
        run: |
          git fetch origin dev-newui --depth=200
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev-newui \
            || { echo "::error::tag $GITHUB_REF_NAME is not on dev-newui"; exit 1; }

      # 版本不写死：action-setup v4 会读 package.json 的 packageManager。
      # 必须是 9.14.4 —— pnpm 10+ 不再读 pnpm.overrides，会把 pnpm-lock.yaml
      # 里的 overrides 块整个删掉，那是 CVE-2026-54466 的三个 pin。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm build+zip
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build
  deploy-web:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
  create-release:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract Release Notes
        id: extract_notes
        shell: bash
        run: |
          LOG_FILE="CHANGELOG.md"
          
          if [ -f "$LOG_FILE" ]; then
            # 使用 awk 提取：从第一个 "## " 后面开始，直到遇到下一个 "## " 停止
            # 这里的逻辑假设最新日志在文件最上方
            NOTES=$(awk '/^## / {if (p) exit; p=1; next} p' "$LOG_FILE")
          else
            NOTES="Release ${{ github.ref }}"
          fi
          
          # 处理多行文本并写入 GITHUB_OUTPUT
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/create-release@v1
        id: create-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: ${{ steps.extract_notes.outputs.body }}
          draft: false
          prerelease: false
  upload-release:
    needs: [build, create-release]
    strategy:
      matrix:
        client: ["chrome", "edge", "firefox", "userscript", "thunderbird"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./build/${{ matrix.client }}.zip
          asset_name: kiss-translator-m3_${{ github.ref_name }}_${{ matrix.client }}.zip
          asset_content_type: application/zip
